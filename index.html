<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MUP – Medical Union Pharmaceuticals</title>
<noscript><meta http-equiv="refresh" content="0;url=home.html"></noscript>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#fff}
@media(prefers-color-scheme:dark){html,body{background:#0A1630}}
#site{position:fixed;inset:0;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="site" title="MUP – Medical Union Pharmaceuticals" allow="autoplay"></iframe>
<!-- MUP ambient music: generated live in the browser (no audio file, no copyright issues) -->
<style>
#mupm{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:65;width:48px;height:48px;padding:0;border-radius:50%;border:1.5px solid rgba(247,144,33,.75);background:var(--te,#008D97);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 10px 24px rgba(10,46,51,.3);transition:transform .2s,background-color .2s}
#mupm:hover{transform:scale(1.07)}
#mupm:focus-visible{outline:3px solid var(--or,#F79021);outline-offset:3px}
#mupm svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#mupm .on{display:none}
#mupm[aria-pressed="true"] .on{display:block}
#mupm[aria-pressed="true"] .off{display:none}
#mupm:not([aria-pressed="true"]){background:#4d6a70}
#mupm-hint{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 76px);z-index:65;max-width:210px;padding:9px 14px;border-radius:14px 14px 4px 14px;background:var(--dk,#0A2E33);color:#fff;font:600 13px/1.35 inherit;font-family:inherit;box-shadow:0 10px 24px rgba(10,46,51,.3);opacity:0;pointer-events:none;transition:opacity .4s}
#mupm-hint.show{opacity:1}
@media(prefers-reduced-motion:no-preference){#mupm.wait{animation:mupm-p 1.8s ease-out infinite}@keyframes mupm-p{0%{box-shadow:0 0 0 0 rgba(247,144,33,.6)}100%{box-shadow:0 0 0 16px rgba(247,144,33,0)}}}
</style>
<button id="mupm" type="button" aria-pressed="false" aria-label="Turn background music on" title="Background music">
<svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 5 6M21 9l-5 6"/></svg>
<svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
</button>
<div id="mupm-hint" role="status" aria-live="polite">Tap anywhere to start the music</div>
<script>
(function(){
var btn=document.getElementById("mupm"),KEY="mup-music",AC=window.AudioContext||window.webkitAudioContext;
if(!btn)return;if(!AC){btn.style.display="none";return}
var ctx,master,bus,playing=false,want=true,idx=0,chordT=null,bellT=null,TARGET=.5;
try{if(localStorage.getItem(KEY)==="off")want=false}catch(e){}
function save(v){try{localStorage.setItem(KEY,v?"on":"off")}catch(e){}}
function ui(on){btn.setAttribute("aria-pressed",on?"true":"false");btn.setAttribute("aria-label",on?"Turn background music off":"Turn background music on")}
var hintEl=document.getElementById("mupm-hint"),hintT=null;
function hint(on){btn.classList.toggle("wait",on);if(hintEl)hintEl.classList.toggle("show",on);clearTimeout(hintT);if(on)hintT=setTimeout(function(){if(hintEl)hintEl.classList.remove("show")},12000)}
function hz(m){return 440*Math.pow(2,(m-69)/12)}
function impulse(c){var n=Math.floor(c.sampleRate*4),b=c.createBuffer(2,n,c.sampleRate);for(var k=0;k<2;k++){var d=b.getChannelData(k);for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.6)}return b}
function build(){
 ctx=new AC();master=ctx.createGain();master.gain.value=0;bus=ctx.createGain();
 var comp=ctx.createDynamicsCompressor(),rev=ctx.createConvolver(),wet=ctx.createGain(),dry=ctx.createGain();
 rev.buffer=impulse(ctx);wet.gain.value=.6;dry.gain.value=.65;
 bus.connect(dry);bus.connect(rev);rev.connect(wet);dry.connect(master);wet.connect(master);master.connect(comp);comp.connect(ctx.destination);
}
var CH=[[50,54,57,64],[47,50,54,61],[43,50,54,59],[45,52,59,61]];
var BASS=[38,35,31,33];
function voice(m,t,dur,peak,wave){
 var g=ctx.createGain(),f=ctx.createBiquadFilter();f.type="lowpass";f.frequency.value=950;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+3);g.gain.setValueAtTime(peak,t+dur);g.gain.linearRampToValueAtTime(0,t+dur+3.5);
 [-4,4].forEach(function(c){var o=ctx.createOscillator();o.type=wave;o.frequency.value=hz(m);o.detune.value=c;o.connect(f);o.start(t);o.stop(t+dur+3.6)});
 f.connect(g);g.connect(bus);
}
function chord(){
 if(!playing)return;var t=ctx.currentTime+.1,c=CH[idx%4];
 c.forEach(function(m){voice(m,t,9,.05,"triangle")});
 voice(BASS[idx%4],t,9,.07,"sine");idx++;chordT=setTimeout(chord,9000);
}
var PENT=[74,76,78,81,83,86];
function bell(){
 if(!playing)return;var t=ctx.currentTime+.05,m=PENT[Math.floor(Math.random()*PENT.length)];
 [[1,.05],[2.01,.012]].forEach(function(p){var o=ctx.createOscillator(),g=ctx.createGain();o.type="sine";o.frequency.value=hz(m)*p[0];
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(p[1],t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+5);o.connect(g);g.connect(bus);o.start(t);o.stop(t+5.2)});
 bellT=setTimeout(bell,3500+Math.random()*4500);
}
function start(){
 if(playing)return;
 try{if(!ctx)build();var p=ctx.resume();if(p&&p.catch)p.catch(function(){})}catch(e){return}
 playing=true;ui(true);hint(false);var n=ctx.currentTime;master.gain.cancelScheduledValues(n);master.gain.setValueAtTime(master.gain.value,n);master.gain.linearRampToValueAtTime(TARGET,n+3);
 clearTimeout(chordT);clearTimeout(bellT);chord();bellT=setTimeout(bell,2500);
}
function halt(fast){
 playing=false;clearTimeout(chordT);clearTimeout(bellT);if(!ctx)return;
 var n=ctx.currentTime;master.gain.cancelScheduledValues(n);master.gain.setValueAtTime(master.gain.value,n);master.gain.linearRampToValueAtTime(0,n+(fast?.05:.8));
 setTimeout(function(){if(!playing&&ctx&&ctx.state==="running")ctx.suspend()},fast?150:900);
}
function first(e){
 if(playing||!want)return;
 if(e&&e.target&&btn.contains(e.target))return;
 start();
}
var EV=["click","keydown","touchend","pointerup"];
EV.forEach(function(n){document.addEventListener(n,first,true)});
window.__mupWatch=function(w){try{var d=w.document;EV.forEach(function(n){d.addEventListener(n,first,true)})}catch(e){}};
window.addEventListener("message",function(e){if(e.data==="mup-gesture")first(null)});
btn.addEventListener("click",function(){
 if(playing){want=false;save(false);halt(false);ui(false)}else{want=true;save(true);start()}
});
document.addEventListener("visibilitychange",function(){
 if(!want||!ctx)return;
 if(document.hidden){if(playing){halt(true);btn.dataset.paused="1"}}
 else if(!playing&&(btn.dataset.paused==="1"||ctx.state==="running")){delete btn.dataset.paused;start()}
});
ui(false);
/* try to start as soon as the page opens; if the browser blocks it, start on the first tap/click */
if(want){
 try{
  build();
  if(!document.hidden&&ctx.state==="running"){start()}
  else{
   hint(true);
   var r=ctx.resume();
   if(r&&r.then)r.then(function(){if(want&&!playing&&!document.hidden&&ctx.state==="running")start()},function(){});
  }
 }catch(e){}
}
})();
</script>

<script>
/* the real pages load inside this frame, so the music (which lives here) never stops when visitors move between pages */
(function(){
 var fr=document.getElementById("site"),q=new URLSearchParams(location.search).get("p");
 fr.addEventListener("load",function(){
  try{
   var w=fr.contentWindow;document.title=w.document.title;
   if(window.__mupWatch)window.__mupWatch(w);
   var p=/at-a-glance/.test(w.location.pathname)?"?p=at-a-glance":"";
   history.replaceState(null,"",location.pathname+p+w.location.hash);
  }catch(e){}
 });
 fr.src=(q==="at-a-glance"?"at-a-glance.html":"home.html")+location.hash;
})();
</script>
</body>
</html>
